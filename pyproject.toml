[project]
name = "jyutping-transfer"
version = "1.1.0"
description = "Desktop tool for annotating Cantonese lyrics with Jyutping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "ToJyutping>=3.2.0",
    "opencc-python-reimplemented>=0.1.7",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "export", "ui"]